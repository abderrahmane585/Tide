<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
   <link rel="icon" type="image/png" href="tide-icon.svg">

<style>
:root{
  --bg:#e9eef5;--bg2:#dfe6f2;--surface:rgba(255,255,255,.72);--line:rgba(27,35,64,.10);
  --ink:#1b2340;--mute:#6b7494;--accent:#5b5bd6;--accent-ink:#fff;--good:#1fae86;--bad:#ef5b72;
  --c-housing:#5b5bd6;--c-food:#1fae86;--c-transport:#f2a63b;--c-fun:#ef5b72;--c-health:#3aa0e8;--c-other:#9a8fc9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1426;--bg2:#161d38;--surface:rgba(30,38,72,.62);--line:rgba(200,210,255,.12);
  --ink:#e8ecff;--mute:#8f99c4;--accent:#8b8bff;--accent-ink:#0f1426;--good:#3fd6aa;--bad:#ff7a90;
  --c-housing:#8b8bff;--c-food:#3fd6aa;--c-transport:#ffbf5e;--c-fun:#ff7a90;--c-health:#62b8ff;--c-other:#b7acea;}}
:root[data-theme="dark"]{
  --bg:#0f1426;--bg2:#161d38;--surface:rgba(30,38,72,.62);--line:rgba(200,210,255,.12);
  --ink:#e8ecff;--mute:#8f99c4;--accent:#8b8bff;--accent-ink:#0f1426;--good:#3fd6aa;--bad:#ff7a90;
  --c-housing:#8b8bff;--c-food:#3fd6aa;--c-transport:#ffbf5e;--c-fun:#ff7a90;--c-health:#62b8ff;--c-other:#b7acea;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:400 15px/1.5 "DM Sans",system-ui,sans-serif;
  background-image:radial-gradient(60rem 40rem at 85% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),radial-gradient(50rem 35rem at -10% 40%,color-mix(in srgb,var(--good) 16%,transparent),transparent 60%);
  background-attachment:fixed}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.02em}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font:700 22px "Bricolage Grotesque",sans-serif}
.brand i{width:26px;height:26px;border-radius:50% 50% 50% 8px;background:linear-gradient(135deg,var(--accent),var(--good))}
.btn{font:600 14px "DM Sans",sans-serif;border:0;border-radius:999px;padding:11px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:28px;align-items:center}
.ring{position:relative;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:15;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.mid b{font:700 clamp(30px,5vw,42px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.mid span{color:var(--mute);font-size:13px;margin-top:6px}
.stats{display:grid;gap:14px}
.stat{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px}
.stat:last-child{border:0}
.stat span{color:var(--mute)}
.stat b{font:600 20px "Bricolage Grotesque",sans-serif}
.pos{color:var(--good)}.neg{color:var(--bad)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
input,select{width:100%;font:500 15px "DM Sans",sans-serif;color:var(--ink);background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;color:var(--mute);font:600 14px "DM Sans",sans-serif;padding:9px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
form .btn{width:100%;margin-top:4px}
h2{font-size:20px;margin-bottom:18px}
.cats{display:grid;gap:18px}
.cat .top{display:flex;justify-content:space-between;font-weight:500;margin-bottom:8px}
.cat .top small{color:var(--mute);font-weight:400}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.full{margin-top:20px}
.tx{list-style:none;margin:0;padding:0}
.tx li{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.tx li:last-child{border:0}
.badge{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.tx .n{font-weight:500}.tx .d{color:var(--mute);font-size:13px}
.tx .a{font:600 16px "Bricolage Grotesque",sans-serif}
.x{border:0;background:transparent;color:var(--mute);font-size:20px;cursor:pointer;border-radius:8px;width:32px;height:32px}
.x:hover{color:var(--bad)}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.budget-edit{display:flex;gap:10px;align-items:center;margin-top:18px;color:var(--mute);font-size:13px}
.budget-edit input{width:120px;padding:8px 12px}
.intro{margin-bottom:22px}
.intro h1{font-size:clamp(30px,5vw,46px);line-height:1.05;max-width:16ch}
.intro p{color:var(--mute);margin:10px 0 0;max-width:46ch}
@media(max-width:820px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.ring{max-width:260px;margin:0 auto}.card{padding:22px;border-radius:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><i></i>Tide</div>
    <button class="btn ghost" id="theme" type="button">Switch theme</button>
  </header>

  <div class="intro">
    <h1>See where your money goes this month.</h1>
    <p id="month"></p>
  </div>

  <div class="grid">
    <section class="card hero" aria-label="Monthly summary">
      <div class="ring" id="ring" role="img" aria-label="Spending ring">
        <svg viewBox="0 0 200 200" id="svg"></svg>
        <div class="mid"><b id="left">$0</b><span id="leftLbl">left to spend</span></div>
      </div>
      <div class="stats">
        <div class="stat"><span>Monthly budget</span><b id="sBudget">$0</b></div>
        <div class="stat"><span>Extra income</span><b class="pos" id="sIncome">$0</b></div>
        <div class="stat"><span>Spent so far</span><b class="neg" id="sSpent">$0</b></div>
        <div class="budget-edit"><label for="budgetIn" style="margin:0">Set budget</label><input id="budgetIn" type="number" min="0" step="100" inputmode="decimal"></div>
      </div>
    </section>

    <section class="card" aria-label="Add transaction">
      <h2>Add a transaction</h2>
      <form id="form">
        <div class="seg" role="group" aria-label="Type"><button type="button" class="on" data-t="expense">Expense</button><button type="button" data-t="income">Income</button></div>
        <div style="margin-bottom:14px"><label for="name">Description</label><input id="name" placeholder="e.g. Groceries" required maxlength="40"></div>
        <div class="row2">
          <div><label for="amt">Amount</label><input id="amt" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00 DH" required></div>
          <div><label for="cat">Category</label><select id="cat"></select></div>
        </div>
        <button class="btn" type="submit">Add expense</button>
      </form>
    </section>
  </div>

  <div class="grid full">
    <section class="card" aria-label="Categories">
      <h2>Spending by category</h2>
      <div class="cats" id="cats"></div>
    </section>
    <section class="card" aria-label="Transactions">
      <h2>Recent activity</h2>
      <ul class="tx" id="tx"></ul>
    </section>
  </div>
</div>

<script>
const CATS=[
 {id:"housing",name:"Housing",pct:.35},{id:"food",name:"Food",pct:.2},{id:"transport",name:"Transport",pct:.1},
 {id:"fun",name:"Fun",pct:.1},{id:"health",name:"Health",pct:.1},{id:"other",name:"Other",pct:.15}];
const KEY="tide-budget-v2";
let state={budget:8000,tx:[
 {id:1,name:"Rent",amt:2800,cat:"housing",type:"expense",d:Date.now()-86400000*12},
 {id:2,name:"Groceries",amt:640,cat:"food",type:"expense",d:Date.now()-86400000*6},
 {id:3,name:"Tramway pass",amt:150,cat:"transport",type:"expense",d:Date.now()-86400000*5},
 {id:4,name:"Concert tickets",amt:300,cat:"fun",type:"expense",d:Date.now()-86400000*3},
 {id:5,name:"Freelance project",amt:1200,cat:"other",type:"income",d:Date.now()-86400000*2},
 {id:6,name:"Pharmacy",amt:95,cat:"health",type:"expense",d:Date.now()-86400000}]};
try{const s=localStorage.getItem(KEY);if(s)state=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const $=id=>document.getElementById(id);
const money=n=>(n<0?"-":"")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" DH";
let type="expense";
$("month").textContent=new Date().toLocaleDateString(undefined,{month:"long",year:"numeric"})+". Add what you spend and Tide keeps the rest in view.";
$("cat").innerHTML=CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  type=b.dataset.t;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelector("form .btn").textContent=type==="income"?"Add income":"Add expense";});

$("form").onsubmit=e=>{e.preventDefault();
  const amt=parseFloat($("amt").value);if(!(amt>0))return;
  state.tx.unshift({id:Date.now(),name:$("name").value.trim(),amt,cat:$("cat").value,type,d:Date.now()});
  save();e.target.reset();render();$("name").focus();};
$("budgetIn").onchange=e=>{const v=parseFloat(e.target.value);if(v>=0){state.budget=v;save();render()}};
$("theme").onclick=()=>{const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";render();};
function del(id){state.tx=state.tx.filter(t=>t.id!==id);save();render()}
window.del=del;
const col=id=>getComputedStyle(document.documentElement).getPropertyValue("--c-"+id).trim();

function render(){
  const ex=state.tx.filter(t=>t.type==="expense"),inc=state.tx.filter(t=>t.type==="income");
  const spent=ex.reduce((a,t)=>a+t.amt,0),income=inc.reduce((a,t)=>a+t.amt,0);
  const total=state.budget+income,left=total-spent;
  $("left").textContent=money(left);$("left").className=left<0?"neg":"";
  $("leftLbl").textContent=left<0?"over budget":"left to spend";
  $("sBudget").textContent=money(state.budget);$("sIncome").textContent=money(income);$("sSpent").textContent=money(spent);
  $("budgetIn").value=state.budget;

  // ring
  const R=85,C=2*Math.PI*R,svg=$("svg");let off=0,out=`<circle cx="100" cy="100" r="${R}" stroke="var(--line)"/>`;
  const denom=Math.max(total,spent,1);
  CATS.forEach(c=>{const s=ex.filter(t=>t.cat===c.id).reduce((a,t)=>a+t.amt,0);if(!s)return;
    const len=s/denom*C;
    out+=`<circle cx="100" cy="100" r="${R}" stroke="${col(c.id)}" stroke-linecap="butt" stroke-dasharray="${Math.max(len-2,0)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;});
  svg.innerHTML=out;

  // categories
  $("cats").innerHTML=CATS.map(c=>{
    const s=ex.filter(t=>t.cat===c.id).reduce((a,t)=>a+t.amt,0),lim=state.budget*c.pct,p=lim?Math.min(s/lim*100,100):0;
    return `<div class="cat"><div class="top"><span><span class="dot" style="background:${col(c.id)}"></span>${c.name}</span>
    <small>${money(s)} of ${money(lim)}</small></div>
    <div class="bar"><i style="width:${p}%;background:${s>lim?"var(--bad)":col(c.id)}"></i></div></div>`}).join("");

  // list
  $("tx").innerHTML=state.tx.length?state.tx.slice(0,8).map(t=>{
    const c=CATS.find(x=>x.id===t.cat),inc=t.type==="income";
    return `<li><span class="badge" style="background:${col(t.cat)}">${c.name[0]}</span>
    <div><div class="n">${t.name.replace(/[<>&]/g,"")}</div><div class="d">${c.name}, ${new Date(t.d).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div></div>
    <span class="a ${inc?"pos":""}">${inc?"+":"-"}${money(t.amt)}</span>
    <button class="x" aria-label="Delete ${t.name.replace(/["<>&]/g,"")}" onclick="del(${t.id})">×</button></li>`}).join("")
    :`<li class="empty" style="display:block">No transactions yet. Add your first one to start the ring.</li>`;
}
render();
</script>
</body>
</html>
